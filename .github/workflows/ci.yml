name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: test -f index.html && test -f css/style.css && test -f data/resume.json && test -f projects/index.html

      - name: Validate HTML
        run: npx --yes html-validate@9 --config .htmlvalidate.json index.html "projects/*.html"

      - name: Check resume data
        run: |
          node -e "
            const R = JSON.parse(require('fs').readFileSync('data/resume.json','utf8'));
            for (const k of ['name','role','about','skills','experience','education','certs'])
              if (!R[k]) throw new Error('resume.json: ' + k + ' is missing');
            console.log('resume.json OK for', R.name);
          "
