<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Raphael De Luis</title>
<meta name="description" content="Home lab and cloud projects by Raphael De Luis: Proxmox VE, containerization and AWS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #14161b; --muted: #5b616d;
    --line: #e3e5ea; --accent: #0f9d76; --accent-soft: #e0f5ee; --on-accent: #fff;
    --radius: 14px; --max: 1040px;
  }
  [data-theme="dark"] {
    --bg: #070a10; --surface: #0e131c; --text: #eceef2; --muted: #98a0ae;
    --line: #1c2430; --accent: #34d3a0; --accent-soft: #10261f; --on-accent: #04130d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 96px; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; transition: background .2s, color .2s; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  nav {
    position: sticky; top: 14px; z-index: 10;
    width: calc(100% - 32px); max-width: var(--max); margin: 14px auto 0;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.14);
  }
  nav .wrap { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 12px 0 24px; }
  nav .brand { font-weight: 800; letter-spacing: -.02em; color: var(--text); margin-right: auto; }
  nav .links { display: flex; gap: 20px; }
  nav .links a { color: var(--muted); font-size: 14px; font-weight: 500; }
  nav .links a:hover, nav .links a.active { color: var(--text); text-decoration: none; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 14px; }
  @media (max-width: 760px) {
    nav .wrap { gap: 10px; padding: 0 8px 0 18px; }
    nav .brand { display: none; }
    nav .links { flex: 1; gap: 16px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    nav .links::-webkit-scrollbar { display: none; }
  }

  header.page { padding: 72px 0 32px; }
  .crumb { font-family: "JetBrains Mono", monospace; color: var(--accent); font-size: 14px; }
  header.page h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.08; letter-spacing: -.03em; margin: 10px 0 14px; }
  header.page p { color: var(--muted); font-size: 18px; max-width: 640px; margin: 0; }

  .tag { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 500; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 24px; color: var(--text); transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); text-decoration: none; }
  .card h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
  .card p { color: var(--muted); font-size: 15px; margin: 0 0 16px; flex: 1; }
  .card .tags { margin-bottom: 16px; }
  .card .go { color: var(--accent); font-weight: 600; font-size: 14px; }

  .back { display: inline-block; margin: 32px 0 48px; font-weight: 600; }
  footer { padding: 24px 0 48px; color: var(--muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="../index.html" class="brand" id="brand"></a>
    <div class="links">
      <a href="../index.html#about">About</a><a href="../index.html#skills">Skills</a><a href="../index.html#experience">Experience</a>
      <a href="index.html" class="active">Projects</a><a href="../index.html#contact">Contact</a>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<main class="wrap">
  <header class="page">
    <div class="crumb">~/projects</div>
    <h1>Projects</h1>
    <p>Home lab, virtualization and cloud projects I've built while learning and practicing infrastructure. Open one for the details.</p>
  </header>

  <div class="grid" id="list"></div>
  <a class="back" href="../index.html">← Back to resume</a>
</main>

<footer id="footer"></footer>

<script src="projects-data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $("brand").textContent = PAGE.name;
  $("footer").textContent = `© ${new Date().getFullYear()} ${PAGE.name}`;

  $("list").innerHTML = PROJECTS.map(p => `
    <a class="card" href="project.html?id=${encodeURIComponent(p.id)}">
      <h2>${esc(p.name)}</h2><p>${esc(p.summary)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <span class="go">View project →</span>
    </a>`).join("");

  const root = document.documentElement;
  let theme; try { theme = localStorage.getItem("theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  root.dataset.theme = theme;
  $("themeBtn").onclick = () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  };
</script>
</body>
</html>
