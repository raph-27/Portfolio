<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Raphael De Luis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #14161b; --muted: #5b616d;
    --line: #e3e5ea; --accent: #0f9d76; --accent-soft: #e0f5ee; --on-accent: #fff;
    --radius: 14px; --max: 1040px;
  }
  [data-theme="dark"] {
    --bg: #070a10; --surface: #0e131c; --text: #eceef2; --muted: #98a0ae;
    --line: #1c2430; --accent: #34d3a0; --accent-soft: #10261f; --on-accent: #04130d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; transition: background .2s, color .2s; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }
  .narrow { max-width: 760px; }

  nav {
    position: sticky; top: 14px; z-index: 10;
    width: calc(100% - 32px); max-width: var(--max); margin: 14px auto 0;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.14);
  }
  nav .wrap { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 12px 0 24px; }
  nav .brand { font-weight: 800; letter-spacing: -.02em; color: var(--text); margin-right: auto; }
  nav .links { display: flex; gap: 20px; }
  nav .links a { color: var(--muted); font-size: 14px; font-weight: 500; }
  nav .links a:hover, nav .links a.active { color: var(--text); text-decoration: none; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 14px; }
  @media (max-width: 760px) {
    nav .wrap { gap: 10px; padding: 0 8px 0 18px; }
    nav .brand { display: none; }
    nav .links { flex: 1; gap: 16px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    nav .links::-webkit-scrollbar { display: none; }
  }

  header.page { padding: 64px 0 24px; }
  .crumb { font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--muted); }
  .crumb a { color: var(--accent); }
  header.page h1 { font-size: clamp(32px, 5.5vw, 50px); line-height: 1.1; letter-spacing: -.03em; margin: 12px 0 14px; }
  header.page p { color: var(--muted); font-size: 18px; margin: 0 0 18px; }

  .tag { background: var(--accent-soft); color: var(--accent); padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 500; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }

  .block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 16px; }
  .block h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
  .block ul { margin: 0; padding-left: 20px; color: var(--muted); }
  .block li { margin-bottom: 6px; }
  .block li strong { color: var(--text); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 32px 0 16px; }
  .pager a { display: block; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 14px 18px; color: var(--text); transition: border-color .15s; }
  .pager a:hover { border-color: var(--accent); text-decoration: none; }
  .pager small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
  .pager .next { text-align: right; grid-column: 2; }
  .pager .prev { grid-column: 1; }
  .back { display: inline-block; margin: 8px 0 48px; font-weight: 600; }
  footer { padding: 24px 0 48px; color: var(--muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="../index.html" class="brand" id="brand"></a>
    <div class="links">
      <a href="../index.html#about">About</a><a href="../index.html#skills">Skills</a><a href="../index.html#experience">Experience</a>
      <a href="index.html" class="active">Projects</a><a href="../index.html#contact">Contact</a>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<main class="wrap narrow" id="main"></main>
<footer id="footer"></footer>

<script src="projects-data.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $("brand").textContent = PAGE.name;
  $("footer").textContent = `© ${new Date().getFullYear()} ${PAGE.name}`;

  const id = new URLSearchParams(location.search).get("id");
  const i = PROJECTS.findIndex(p => p.id === id);

  if (i < 0) {
    document.title = `Project not found — ${PAGE.name}`;
    $("main").innerHTML = `<header class="page"><h1>Project not found</h1>
      <p>That project doesn't exist.</p></header><a class="back" href="index.html">← All projects</a>`;
  } else {
    const p = PROJECTS[i], prev = PROJECTS[i - 1], next = PROJECTS[i + 1];
    document.title = `${p.name} — ${PAGE.name}`;
    $("main").innerHTML = `
      <header class="page">
        <div class="crumb"><a href="index.html">projects</a> / ${esc(p.id)}</div>
        <h1>${esc(p.name)}</h1>
        <p>${esc(p.summary)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </header>
      ${p.sections.map(s => `<section class="block"><h2>${esc(s.title)}</h2><ul>${
        s.items.map(x => `<li>${s.html ? x : esc(x)}</li>`).join("")}</ul></section>`).join("")}
      <div class="pager">
        ${prev ? `<a class="prev" href="project.html?id=${encodeURIComponent(prev.id)}"><small>← Previous</small>${esc(prev.name)}</a>` : ""}
        ${next ? `<a class="next" href="project.html?id=${encodeURIComponent(next.id)}"><small>Next →</small>${esc(next.name)}</a>` : ""}
      </div>
      <a class="back" href="index.html">← All projects</a>`;
  }

  const root = document.documentElement;
  let theme; try { theme = localStorage.getItem("theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  root.dataset.theme = theme;
  $("themeBtn").onclick = () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  };
</script>
</body>
</html>
