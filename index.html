<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raphael De Luis — Resume</title>
<meta name="description" content="Resume and skills of Raphael De Luis, IT Infrastructure &amp; Network Engineer.">
<meta name="color-scheme" content="light dark">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="projects/projects-data.js"></script>

<nav>
  <div class="wrap">
    <a href="#top" class="brand" id="brand">Raphael De Luis</a>
    <div class="links">
      <a href="#about">About</a><a href="#skills">Skills</a><a href="#experience">Experience</a>
      <a href="#projects">Projects</a><a href="#contact">Contact</a>
    </div>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<main class="wrap" id="top">
  <header class="hero reveal">
    <div class="hero-top">
      <div class="hero-id">
        <div class="eyebrow">Hello, I'm</div>
        <h1 id="name">Raphael De Luis</h1>
      </div>
      <img class="avatar" src="Pictures/DP.jpg" alt="Portrait of Raphael De Luis" width="200" height="200">
    </div>
    <p class="role" id="role"></p>
    <div class="meta" id="meta"></div>
    <div class="btns" id="heroBtns"></div>
  </header>

  <section id="about" class="reveal"><div class="sec-head"><h2>About</h2>
    <div class="about"><div id="aboutText"></div><div class="stats" id="stats"></div></div></div></section>

  <section id="skills" class="reveal"><div class="sec-head"><h2>Skills</h2>
    <div class="skill-groups" id="skillGroups"></div></div></section>

  <section id="experience" class="reveal"><div class="sec-head"><h2>Experience</h2>
    <div id="timeline"></div></div></section>

  <section id="projects" class="reveal"><div class="sec-head"><h2>Projects</h2>
    <div class="projects" id="projectList"></div></div></section>

  <section id="education" class="reveal"><div class="sec-head"><h2>Education</h2>
    <div class="edu" id="eduList"></div></div></section>

  <section id="certs" class="reveal"><div class="sec-head"><h2>Certifications</h2>
    <div class="edu certs" id="certList"></div></div></section>

  <section id="contact" class="reveal">
    <div class="contact-box">
      <h3>Let's work together.</h3>
      <p>Open to new opportunities, collaborations, and conversations.</p>
      <div class="btns" id="contactBtns"></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Certificate preview" hidden>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
</div>

<script>
(async () => {
  let R;
  try { R = await (await fetch("data/resume.json")).json(); }
  catch (err) { document.body.insertAdjacentHTML("beforeend", "<p style=\"padding:24px;text-align:center\">Could not load data/resume.json. Open this site through a web server (or GitHub Pages), not by double-clicking the file.</p>"); throw err; }
  const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    document.title = `${R.name} — ${R.role}`;
    $("brand").textContent = R.name;
    $("name").textContent = R.name;
    $("role").innerHTML = `<strong>${esc(R.role)}</strong> · <span class="typed" id="tagline">${esc(R.tagline)}</span>`;
    // Typing animation for the tagline (reserves its final height first so nothing below jumps)
    (() => {
      const el = $("tagline"), full = R.tagline, role = $("role");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      role.style.minHeight = role.offsetHeight + "px";
      el.setAttribute("aria-label", full);
      el.textContent = "";
      el.classList.add("typing");
      let i = 0;
      const tick = () => {
        el.textContent = full.slice(0, ++i);
        if (i < full.length) setTimeout(tick, 28 + Math.random() * 40);
        else setTimeout(() => { i = 0; el.textContent = ""; tick(); }, 5000);  // repeat 5s after finishing
      };
      setTimeout(tick, 700);
    })();
    $("meta").innerHTML = [R.location && `📍 ${esc(R.location)}`, R.email && `✉️ ${esc(R.email)}`, R.phone && `📞 ${esc(R.phone)}`]
      .filter(Boolean).map(x => `<span>${x}</span>`).join("");

    const linkBtns = (cls) => R.links.map(l => `<a class="btn ${cls}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
    $("heroBtns").innerHTML =
      `<a class="btn primary" href="#contact">Get in touch</a>` +
      `<a class="btn download" href="${encodeURI(R.resumePdf)}" download><span class="dl-icon" aria-hidden="true">⬇</span> Download Resume</a>` + linkBtns("");

    $("aboutText").innerHTML = R.about.map(p => `<p>${esc(p)}</p>`).join("");
    $("stats").innerHTML = R.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("");

    // Skills: filter pills + icon tiles
    const skillItems = R.skills.items, skillCats = [...new Set(skillItems.map(s => s.cat))];
    let skillCat = "All";
    const iconUrl = i => !i ? "" : /^https?:|\.(png|jpe?g|svg|webp)$/i.test(i) ? encodeURI(i) : "https://cdn.simpleicons.org/" + i;
    const tile = s => `<div class="skill-tile">${s.icon
        ? `<img src="${esc(iconUrl(s.icon))}" alt="" loading="lazy" referrerpolicy="no-referrer" data-emoji="${esc(s.emoji || "•")}">`
        : `<div class="glyph" aria-hidden="true">${esc(s.emoji || "•")}</div>`}<span>${esc(s.name)}</span></div>`;
    function renderSkills() {
      $("skillGroups").innerHTML =
        `<div class="skill-filters" role="group" aria-label="Filter skills">` +
        ["All", ...skillCats].map(c => `<button type="button" class="pill${c === skillCat ? " on" : ""}" data-cat="${esc(c)}">${esc(c)} <small>${
          c === "All" ? skillItems.length : skillItems.filter(s => s.cat === c).length}</small></button>`).join("") +
        `</div><div class="skill-grid">${skillItems.filter(s => skillCat === "All" || s.cat === skillCat).map(tile).join("")}</div>`;
    }
    $("skillGroups").addEventListener("click", e => {
      const b = e.target.closest(".pill");
      if (b) { skillCat = b.dataset.cat; renderSkills(); }
    });
    // If a logo can't load (offline, blocked, unknown slug), swap in its emoji.
    $("skillGroups").addEventListener("error", e => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      const g = document.createElement("div");
      g.className = "glyph"; g.setAttribute("aria-hidden", "true"); g.textContent = img.dataset.emoji || "•";
      img.replaceWith(g);
    }, true);
    renderSkills();

    $("timeline").innerHTML = R.experience.map(j => `
      <div class="job"><div class="top"><h3>${esc(j.title)}</h3><span class="when">${esc(j.when)}</span></div>
      <div class="org">${esc(j.company)}</div><ul>${j.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("");

    $("projectList").innerHTML = PROJECTS.filter(p => p.featured).map(p => `
      <div class="card project"><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <a href="projects/${encodeURIComponent(p.id)}.html">View project →</a></div>`).join("") +
      `<div style="grid-column:1/-1"><a class="btn" href="projects/index.html">View all projects →</a></div>`;

    $("eduList").innerHTML = R.education.map(e => `
      <div class="card"><div class="edu-text"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.sub)}</div></div>
      <span class="when">${esc(e.when)}</span></div>`).join("");

    $("certList").innerHTML = R.certs.map(e => `
      <div class="card"><button type="button" class="thumb" data-full="${encodeURI(e.img)}" aria-label="View ${esc(e.title)} certificate larger"><img src="${encodeURI(e.img)}" alt="${esc(e.title)} certificate" loading="lazy"></button>
      <div class="edu-text"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.sub)}</div></div></div>`).join("");

    $("contactBtns").innerHTML =
      (R.email ? `<a class="btn primary" href="mailto:${esc(R.email)}">✉️ ${esc(R.email)}</a>` : "") +
      (R.linkedin ? `<a class="btn primary" href="${esc(R.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : "") + linkBtns("");

    $("footer").textContent = `© ${new Date().getFullYear()} ${R.name}`;

    const lb = $("lightbox"), lbImg = $("lightboxImg"), BLANK = lbImg.src;
    const closeLb = () => { lb.hidden = true; lbImg.src = BLANK; document.body.style.overflow = ""; };
    $("certList").addEventListener("click", ev => {
      const b = ev.target.closest(".thumb");
      if (!b) return;
      lbImg.src = b.dataset.full;
      lbImg.alt = b.querySelector("img").alt;
      lb.hidden = false;
      document.body.style.overflow = "hidden";
      $("lightboxClose").focus();
    });
    lb.addEventListener("click", ev => { if (ev.target !== lbImg) closeLb(); });
    document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !lb.hidden) closeLb(); });

    const topNav = document.querySelector("nav");
    const syncNav = () => topNav.classList.toggle("floating", window.scrollY > 100);
    window.addEventListener("scroll", syncNav, { passive: true });
    syncNav();

    // Scroll reveal + animated skill bars
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%");
      io.unobserve(e.target);
    }), { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    window.addEventListener("beforeprint", () =>
      document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
})();
</script>
</body>
</html>
