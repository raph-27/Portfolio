<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #14161b; --muted: #5b616d;
    --line: #e3e5ea; --accent: #0f9d76; --accent-soft: #e0f5ee; --on-accent: #fff;
    --radius: 14px; --max: 1040px;
  }
  [data-theme="dark"] {
    --bg: #070a10; --surface: #0e131c; --text: #eceef2; --muted: #98a0ae;
    --line: #1c2430; --accent: #34d3a0; --accent-soft: #10261f; --on-accent: #04130d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 96px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: background .2s, color .2s;
  }
  /* Light mode only: soft color glows + faint dot grid so the page isn't flat white */
  :root:not([data-theme="dark"]) body {
    background-color: #eef2f7;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(15,157,118,.20), transparent 38%),
      radial-gradient(circle at 92% 22%, rgba(59,130,246,.16), transparent 40%),
      radial-gradient(circle at 20% 70%, rgba(139,92,246,.10), transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(15,157,118,.14), transparent 38%),
      radial-gradient(rgba(20,22,27,.07) 1px, transparent 1.2px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 22px 22px;
    background-attachment: fixed;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  nav {
    position: sticky; top: 14px; z-index: 10;
    width: calc(100% - 32px); max-width: var(--max); margin: 14px auto 0;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.14);
  }
  nav .wrap { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 12px 0 24px; }
  nav .brand { font-weight: 800; letter-spacing: -.02em; color: var(--text); margin-right: auto; }
  nav .links { display: flex; gap: 20px; }
  nav .links a { color: var(--muted); font-size: 14px; font-weight: 500; }
  nav .links a:hover { color: var(--text); text-decoration: none; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 14px;
  }

  .hero { padding: 88px 0 64px; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .hero-id { min-width: 0; }
  .hero .avatar {
    flex: 0 0 auto; width: clamp(140px, 28vw, 280px); height: clamp(140px, 28vw, 280px);
    border-radius: 50%; object-fit: cover; border: 4px solid var(--accent);
    animation: av-in .9s cubic-bezier(.2,.8,.2,1) both, av-float 5s ease-in-out .9s infinite, av-glow 3s ease-in-out infinite;
    transition: transform .3s;
  }
  .hero .avatar:hover { animation-play-state: running, paused, running; transform: scale(1.06) rotate(-2deg); }
  @keyframes av-in { from { opacity: 0; transform: scale(.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes av-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes av-glow {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent), 0 10px 30px rgba(0,0,0,.18); }
    50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 0%, transparent), 0 14px 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .hero .avatar { animation: none; } }
  .hero .eyebrow { font-family: "JetBrains Mono", monospace; color: var(--accent); font-size: 14px; }
  .hero h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1.05; letter-spacing: -.035em; margin: 12px 0 16px; }
  .hero .role { font-size: clamp(18px, 2.4vw, 22px); color: var(--muted); margin: 0 0 28px; max-width: 660px; }
  .hero .role strong { color: var(--text); }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 10px 20px; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
    font: inherit; font-weight: 600; font-size: 15px; border: 1px solid var(--line);
    color: var(--text); background: var(--surface); cursor: pointer; transition: transform .15s;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn:hover { text-decoration: none; transform: translateY(-1px); }
  .btn.download {
    position: relative; overflow: hidden; color: var(--on-accent); border-color: transparent;
    background: linear-gradient(120deg, var(--accent), #3b82f6, var(--accent)); background-size: 200% 100%;
    animation: dl-pulse 2.2s ease-out infinite, dl-shift 4s linear infinite;
  }
  .btn.download::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg); animation: dl-shine 3s ease-in-out infinite;
  }
  .btn.download .dl-icon { display: inline-block; animation: dl-bounce 1.4s ease-in-out infinite; }
  .btn.download:hover { transform: translateY(-2px) scale(1.04); animation-play-state: paused, running; }
  @keyframes dl-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 14px transparent; } }
  @keyframes dl-shift { to { background-position: -200% 0; } }
  @keyframes dl-shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  @keyframes dl-bounce { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { .btn.download, .btn.download::after, .btn.download .dl-icon { animation: none; } }

  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

  .project p { color: var(--muted); font-size: 15px; margin: 0 0 16px; flex: 1; }
  .project .tags { margin-bottom: 14px; }

  .edu { display: grid; gap: 14px; }
  .edu .card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
  .edu .card { align-items: center; }
  .edu .edu-text { flex: 1 1 240px; }
  .edu .thumb { flex: 0 0 auto; display: block; width: 96px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .edu .thumb img { display: block; width: 100%; height: auto; }
  .edu h3 { margin: 0; }
  .edu .sub { color: var(--muted); font-size: 15px; }
  .edu .thumb { padding: 0; font: inherit; background: none; cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.85); cursor: zoom-out; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: min(1100px, 100%); max-height: 100%; object-fit: contain; border-radius: 6px; background: #fff; cursor: default; }
  .lightbox-close { position: absolute; top: 14px; right: 18px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
  .edu.certs { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .edu.certs .card { flex-direction: column; align-items: stretch; flex-wrap: nowrap; padding: 14px; gap: 12px; }
  .edu.certs .thumb { width: 100%; aspect-ratio: 4 / 3; background: var(--accent-soft); }
  .edu.certs .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .edu.certs .edu-text { flex: 0 0 auto; }
  .edu.certs h3 { font-size: 15px; line-height: 1.3; margin-bottom: 4px; }
  .edu.certs .sub { font-size: 13px; }
  @media (max-width: 820px) { .edu.certs { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .edu.certs { grid-template-columns: 1fr; } }

  .contact-box { background: var(--surface); border: 1px solid var(--accent); border-radius: 20px; padding: 40px; }
  .contact-box h3 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.02em; }
  .contact-box p { color: var(--muted); margin: 0 0 24px; }

  footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; text-align: center; }

  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .fill { transition: none; } }

  @media print {
    nav, .btns, #themeBtn, footer { display: none !important; }
    :root, [data-theme="dark"] { --bg:#fff; --surface:#fff; --text:#000; --muted:#333; --line:#ccc; --accent:#0a6b4f; --accent-soft:#eee; }
    body { font-size: 12px; }
    .hero { padding: 0 0 16px; }
    section { padding: 16px 0; break-inside: avoid; }
    .reveal { opacity: 1; transform: none; }
    .contact-box { border: 0; padding: 0; }
  }
</style>

  $("projectList").innerHTML = PROJECTS.filter(p => p.featured).map(p => `
    <div class="card project"><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p>
    <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <a href="projects/${encodeURIComponent(p.id)}.html">View project →</a></div>`).join("") +
    `<div style="grid-column:1/-1"><a class="btn" href="projects/index.html">View all projects →</a></div>`;

  $("eduList").innerHTML = R.education.map(e => `
    <div class="card"><div class="edu-text"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.sub)}</div></div>
    <span class="when">${esc(e.when)}</span></div>`).join("");

  $("certList").innerHTML = R.certs.map(e => `
    <div class="card"><button type="button" class="thumb" data-full="${encodeURI(e.img)}" aria-label="View ${esc(e.title)} certificate larger"><img src="${encodeURI(e.img)}" alt="${esc(e.title)} certificate" loading="lazy"></button>
    <div class="edu-text"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.sub)}</div></div></div>`).join("");

  $("contactBtns").innerHTML =
    (R.email ? `<a class="btn primary" href="mailto:${esc(R.email)}">✉️ ${esc(R.email)}</a>` : "") + linkBtns("");

  $("footer").textContent = `© ${new Date().getFullYear()} ${R.name}`;

  // Theme: dark by default unless the visitor chose otherwise
  const root = document.documentElement;
  let theme; try { theme = localStorage.getItem("theme"); } catch {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  root.dataset.theme = theme;
  const lb = $("lightbox"), lbImg = $("lightboxImg"), BLANK = lbImg.src;
  const closeLb = () => { lb.hidden = true; lbImg.src = BLANK; document.body.style.overflow = ""; };
  $("certList").addEventListener("click", ev => {
    const b = ev.target.closest(".thumb");
    if (!b) return;
    lbImg.src = b.dataset.full;
    lbImg.alt = b.querySelector("img").alt;
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    $("lightboxClose").focus();
  });
  lb.addEventListener("click", ev => { if (ev.target !== lbImg) closeLb(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !lb.hidden) closeLb(); });

  $("themeBtn").onclick = () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  };

  // Scroll reveal + animated skill bars
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in");
    e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%");
    io.unobserve(e.target);
  }), { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  window.addEventListener("beforeprint", () =>
    document.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
</script>
</body>
</html>
